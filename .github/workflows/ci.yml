name: CI - Build e Testes

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

jobs:
  build-test:
    name: Build e Testes Automatizados
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar build e testes
        run: mvn -B clean test

      - name: Validar build da imagem Docker
        run: docker build -t ecoimpact-api:ci .