services:

  db:
    image: mysql:8.0
    container_name: ecoimpact-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - ecoimpact_mysql_data:/var/lib/mysql

    networks:
      - ecoimpact-network

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10


  api:
    build:
      context: .

    container_name: ecoimpact-api

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DATABASE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - ecoimpact-network


volumes:
  ecoimpact_mysql_data:


networks:
  ecoimpact-network:
    driver: bridge
    